name: Run Postman Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Node.js (required for Newman)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Step 3: Install Newman (Postman CLI)
      - name: Install Newman
        run: npm install -g newman

      # Step 4: Run Postman collection using local JSON files
      - name: Run Postman Collection
        run: |
          newman run project-1\ GoMyGo/postman/collection.json \
            -e project-1\ GoMyGo/postman/environment.json \
            --reporters cli,junit \
            --reporter-junit-export newman-results.xml
