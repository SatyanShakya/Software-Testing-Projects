name: Run Postman Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Postman Collection
        uses: postman/newman-action@v4.1.5
        with:
          collection: '46760181-4f35e701-e62c-4f4d-ba2c-500bbd7e71f5'
          environment: '46760181-743624c6-77e7-4aa6-a944-d4ce8d63645f'
          apiKey: ${{ secrets.POSTMAN_API_KEY }}
